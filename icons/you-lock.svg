<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- slight wobble so lines look hand-drawn -->
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2.4"/>
    </filter>
  </defs>
  <g transform="translate(15 6) scale(0.8)">
    <g transform="rotate(-16 64 70)" filter="url(#rough)" stroke="#1C1C1C" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- long U shackle drawn as an outlined tube -->
      <path d="M44 100 V30 a20 20 0 0 1 40 0 V100" stroke-width="11"/>
      <path d="M44 100 V30 a20 20 0 0 1 40 0 V100" stroke="#FFFFFF" stroke-width="6"/>
      <!-- loose second pencil pass -->
      <path d="M38.5 92 V31 a25 25 0 0 1 30 -24" stroke-width="1.1" opacity="0.6"/>
      <!-- sleeve -->
      <rect x="77.5" y="76" width="13" height="12" rx="1.5" fill="#FFFFFF" stroke-width="2"/>
      <path d="M81 77 V87 M85 77 V87" stroke-width="1.2"/>
      <!-- marker-yellow crossbar fill, a little off the lines -->
      <rect x="24" y="91" width="74" height="18" rx="6" fill="#FFD43B" stroke="none"/>
      <!-- crossbar outline -->
      <rect x="20" y="88" width="76" height="21" rx="7" stroke-width="2.3"/>
      <!-- shading hatch on the underside -->
      <path d="M34 108 l4 -5 M42 108 l4 -5 M50 108 l4 -5 M58 108 l4 -5 M66 108 l4 -5 M74 108 l4 -5 M82 108 l4 -5" stroke-width="1.1" opacity="0.7"/>
      <!-- end caps -->
      <rect x="13" y="89" width="12" height="19" rx="6" fill="#1C1C1C" stroke-width="2"/>
      <rect x="90" y="84" width="26" height="28" rx="11" fill="#1C1C1C" stroke-width="2"/>
      <circle cx="108" cy="97" r="2.6" fill="#FFFFFF" stroke="none"/>
      <!-- grip strip -->
      <path d="M46 101 H70" stroke-width="3.2"/>
    </g>
  </g>
</svg>
